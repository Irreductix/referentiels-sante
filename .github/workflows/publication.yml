name: Publication mensuelle des fichiers convertis

# Le 2 de chaque mois, convertit l'instantané mensuel FINESS+ et la base publique
# des médicaments, et publie les fichiers produits en pièces jointes de deux
# releases. Seules ces deux sources sont rediffusées : elles sont sous Licence
# Ouverte (ANS ; ANSM, HAS, UNCAM). La mention de source est dans le résumé joint.
# Les autres référentiels n'ont pas de licence de réutilisation explicite et ne
# sont jamais publiés ici (voir docs/SOURCES.md).

on:
  schedule:
    - cron: '0 5 2 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Conversion FINESS+ (structures et activités)
        run: node src/cli.js finess --activites --mensuel --sortie sortie/finess
      - name: Archive
        id: archive
        run: |
          etiquette="finess-$(date -u +%Y%m)"
          echo "etiquette=$etiquette" >> "$GITHUB_OUTPUT"
          cd sortie/finess
          zip -q -9 "../${etiquette}.zip" ./*
          ls -la ..
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          etiquette="${{ steps.archive.outputs.etiquette }}"
          notes="Fichiers FINESS+ convertis (instantané mensuel). Source : Agence du Numérique en Santé, data.gouv.fr, Licence Ouverte 2.0. Détail des colonnes : docs/FINESS.md."
          gh release delete "$etiquette" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$etiquette" "sortie/${etiquette}.zip" sortie/finess/structures-resume.json sortie/finess/activites-resume.json --title "FINESS+ $(date -u +%Y-%m)" --notes "$notes"

      # La base des médicaments passe après FINESS : son échec ne doit pas
      # empêcher la publication de FINESS, qui est déjà faite à ce stade.
      - name: Conversion de la base publique des médicaments
        run: node src/cli.js bdpm --sortie sortie/bdpm
      - name: Archive et release des médicaments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          etiquette="bdpm-$(date -u +%Y%m)"
          (cd sortie/bdpm && zip -q -9 "../${etiquette}.zip" ./*)
          notes="Base de données publique des médicaments convertie en CSV UTF-8 : spécialités, présentations, compositions, avis SMR et ASMR, génériques, conditions de prescription, informations importantes, disponibilité. Source : ANSM, HAS, UNCAM, base-donnees-publique.medicaments.gouv.fr, Licence Ouverte. Détail des colonnes : docs/AUTRES-REFERENTIELS.md."
          gh release delete "$etiquette" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$etiquette" "sortie/${etiquette}.zip" sortie/bdpm/bdpm-resume.json --title "Médicaments (BDPM) $(date -u +%Y-%m)" --notes "$notes"
