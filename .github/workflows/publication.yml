name: Publication mensuelle des fichiers convertis

# Le 2 de chaque mois, convertit le dernier instantané mensuel FINESS+ et la base
# publique des médicaments, et les publie dans les releases du mois (finess-AAAAMM,
# bdpm-AAAAMM, AAAAMM étant le mois de publication) et dans la release
# donnees-du-mois, dont les adresses ne changent jamais. Seules ces deux sources,
# sous Licence Ouverte, sont rediffusées ; chaque archive contient
# MENTION-SOURCE.txt. Les autres référentiels n'ont pas de licence de réutilisation
# explicite et ne sont jamais publiés ici (voir docs/SOURCES.md).
# Les passages des 3 et 4 rattrapent un passage du 2 retardé ou échoué, ou un
# instantané FINESS+ déposé en retard : un mois déjà publié n'est pas retouché, sauf
# lancement manuel avec « refaire » ; même alors, les adresses restent valides. Un
# échec ouvre un ticket, refermé à la publication suivante réussie. La publication
# s'arrête plutôt que de publier faux : table de libellés indisponible, comptes
# anormalement bas, valeurs perdues à la conversion. Avec les secrets DATAGOUV_API_KEY
# et HEALTHCHECKS_URL, elle met à jour les fiches data.gouv.fr et envoie un signal de vie.

on:
  schedule:
    - cron: '17 4 2,3,4 * *'
  workflow_dispatch:
    inputs:
      cibles:
        description: Référentiels à publier
        type: choice
        options: [tous, finess, bdpm]
        default: tous
      refaire:
        description: Reconvertir et remplacer les fichiers si la release du mois existe déjà
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: publication
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  REFAIRE: ${{ inputs.refaire }}
  STABLE: donnees-du-mois
  DATAGOUV_API_KEY: ${{ secrets.DATAGOUV_API_KEY }}
  HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_URL }}

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Release à adresse fixe
        run: |
          if ! gh release view "$STABLE" > /dev/null 2>&1; then
            base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${STABLE}"
            gh release create "$STABLE" --latest=false --title "Fichiers du mois, adresse fixe" \
              --notes "Dernières archives converties, toujours aux mêmes adresses : ${base}/finess.zip et ${base}/bdpm.zip. Elles sont remplacées le 2 de chaque mois. L'historique mois par mois est dans les releases finess-AAAAMM et bdpm-AAAAMM."
          fi

      - name: FINESS+ (structures et activités)
        if: inputs.cibles != 'bdpm'
        run: |
          etiquette="finess-$(date -u +%Y%m)"
          archive="sortie/${etiquette}.zip"
          mkdir -p sortie
          # Un brouillon laissé par une exécution interrompue n'est pas une release publiée.
          if [ "$(gh release view "$etiquette" --json isDraft --jq .isDraft 2>/dev/null)" = "true" ]; then
            gh release delete "$etiquette" --yes
          fi
          publiee() { gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${etiquette}" > /dev/null 2>&1; }
          if publiee && [ "$REFAIRE" != "true" ]; then
            echo "La release $etiquette existe déjà : elle est conservée telle quelle."
            taille_mois=$(gh release view "$etiquette" --json assets --jq ".assets[] | select(.name == \"${etiquette}.zip\") | .size")
            taille_fixe=$(gh release view "$STABLE" --json assets --jq '.assets[] | select(.name == "finess.zip") | .size')
            if [ -n "$taille_mois" ] && [ "$taille_mois" = "$taille_fixe" ]; then
              echo "L'adresse fixe sert déjà cette archive."
              exit 0
            fi
            gh release download "$etiquette" --pattern "${etiquette}.zip" --dir sortie --clobber
          else
            node src/cli.js finess --activites --mensuel --sortie sortie/finess
            # L'instantané attendu est celui du mois précédent ; s'il n'est pas encore
            # déposé, rien n'est publié et les passages des 3 et 4 réessaient.
            attendu=$(date -u -d "$(date -u +%Y-%m-01) -1 month" +%Y%m)
            for flux in structures activites; do
              if ! node -p "require('./sortie/finess/${flux}-resume.json').source" | grep -q -- "-mensuel-${attendu}"; then
                echo "Instantané ${flux} du mois ${attendu} absent de data.gouv.fr : rien n'est publié." >&2
                exit 1
              fi
            done
            # Une table NOS indisponible laisserait des libellés vides, un flux trop court
            # trahirait une source tronquée : dans les deux cas rien n'est publié.
            for flux in structures activites; do
              echecs=$(node -p "require('./sortie/finess/${flux}-resume.json').tablesLibellesEnEchec.join(', ')")
              if [ -n "$echecs" ]; then
                echo "Tables NOS indisponibles pour ${flux} (${echecs}) : rien n'est publié." >&2
                exit 1
              fi
            done
            node -e "const r = require('./sortie/finess/structures-resume.json'); if (r.etablissements < 150000 || r.entitesJuridiques < 90000) { console.error('Comptes anormalement bas : ' + r.etablissements + ' établissements, ' + r.entitesJuridiques + ' entités juridiques. Rien n est publié.'); process.exit(1); }"
            node .github/scripts/mention-source.mjs finess sortie/finess
            (cd sortie/finess && zip -q -9 "../${etiquette}.zip" ./*)
            node .github/scripts/index-finess.mjs sortie/finess/etablissements.csv sortie/index-finess.csv.gz
            node -e "const r = require('./sortie/finess/structures-resume.json'); require('fs').writeFileSync('sortie/index-finess.json', JSON.stringify({ instantane: require('path').basename(r.source), produit: String(r.generatedAt).slice(0, 10), converti: String(r.converti).slice(0, 10), etablissements: r.etablissements }) + '\n')"
            # La page de contrôle avec son index, pour un poste sans accès à internet.
            zip -q -j sortie/controle-finess-hors-ligne.zip site/controle/index.html site/controle/controle.js sortie/index-finess.csv.gz sortie/index-finess.json
            instantane=$(node -p "require('path').basename(require('./sortie/finess/structures-resume.json').source)")
            produit=$(node -p "String(require('./sortie/finess/structures-resume.json').generatedAt).slice(0, 10)")
            notes="Fichiers FINESS+ convertis depuis l'instantané mensuel ${instantane}, produit par l'ANS le ${produit}. Source : Agence du Numérique en Santé, data.gouv.fr, Licence Ouverte 2.0 ; libellés des codes : Nomenclatures des objets de santé (NOS) de l'ANS. Détail dans MENTION-SOURCE.txt et docs/FINESS.md."
            if publiee; then
              for f in "$archive" sortie/finess/structures-resume.json sortie/finess/activites-resume.json sortie/index-finess.csv.gz sortie/index-finess.json sortie/controle-finess-hors-ligne.zip; do
                bash .github/scripts/remplacer-piece.sh "$etiquette" "$f"
              done
              gh release edit "$etiquette" --notes "$notes"
            else
              gh release create "$etiquette" "$archive" sortie/finess/structures-resume.json sortie/finess/activites-resume.json sortie/index-finess.csv.gz sortie/index-finess.json sortie/controle-finess-hors-ligne.zip \
                --latest=false --title "FINESS+ $(date -u +%Y-%m)" --notes "$notes"
            fi
          fi
          bash .github/scripts/remplacer-piece.sh "$STABLE" "$archive" finess.zip
          if [ -f sortie/index-finess.csv.gz ]; then
            for f in index-finess.csv.gz index-finess.json controle-finess-hors-ligne.zip; do
              bash .github/scripts/remplacer-piece.sh "$STABLE" "sortie/$f" "$f"
            done
            # Le site embarque l'index : on le redéploie avec le nouvel instantané.
            gh workflow run site.yml --ref "${GITHUB_REF_NAME:-main}"
          fi

      # La base des médicaments passe après FINESS et tourne même si FINESS échoue.
      - name: Base publique des médicaments
        if: ${{ !cancelled() && inputs.cibles != 'finess' }}
        run: |
          etiquette="bdpm-$(date -u +%Y%m)"
          archive="sortie/${etiquette}.zip"
          mkdir -p sortie
          if [ "$(gh release view "$etiquette" --json isDraft --jq .isDraft 2>/dev/null)" = "true" ]; then
            gh release delete "$etiquette" --yes
          fi
          publiee() { gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${etiquette}" > /dev/null 2>&1; }
          if publiee && [ "$REFAIRE" != "true" ]; then
            echo "La release $etiquette existe déjà : elle est conservée telle quelle."
            taille_mois=$(gh release view "$etiquette" --json assets --jq ".assets[] | select(.name == \"${etiquette}.zip\") | .size")
            taille_fixe=$(gh release view "$STABLE" --json assets --jq '.assets[] | select(.name == "bdpm.zip") | .size')
            if [ -n "$taille_mois" ] && [ "$taille_mois" = "$taille_fixe" ]; then
              echo "L'adresse fixe sert déjà cette archive."
              exit 0
            fi
            gh release download "$etiquette" --pattern "${etiquette}.zip" --dir sortie --clobber
          else
            node src/cli.js bdpm --sortie sortie/bdpm
            maj=$(node -p "require('./sortie/bdpm/bdpm-resume.json').miseAJour || 'inconnue'")
            if [ "$maj" = "inconnue" ]; then
              echo "Date de mise à jour introuvable sur la page de la base : la mention de source serait incomplète, rien n'est publié." >&2
              exit 1
            fi
            node -e "const f = require('./sortie/bdpm/bdpm-resume.json').fichiers; if ((f.specialites?.lignes ?? 1e9) < 10000 || (f.presentations?.lignes ?? 1e9) < 15000) { console.error('Comptes anormalement bas : ' + f.specialites?.lignes + ' spécialités, ' + f.presentations?.lignes + ' présentations. Rien n est publié.'); process.exit(1); }"
            node .github/scripts/mention-source.mjs bdpm sortie/bdpm
            (cd sortie/bdpm && zip -q -9 "../${etiquette}.zip" ./*)
            notes="Base de données publique des médicaments convertie en CSV UTF-8 : spécialités, présentations, compositions, avis SMR et ASMR, génériques, conditions de prescription, informations importantes, disponibilité. Dernière mise à jour de la base : ${maj}. Source : ANSM, HAS, UNCAM, base-donnees-publique.medicaments.gouv.fr, Licence Ouverte. Détail dans MENTION-SOURCE.txt et docs/AUTRES-REFERENTIELS.md."
            if publiee; then
              for f in "$archive" sortie/bdpm/bdpm-resume.json; do
                bash .github/scripts/remplacer-piece.sh "$etiquette" "$f"
              done
              gh release edit "$etiquette" --notes "$notes"
            else
              gh release create "$etiquette" "$archive" sortie/bdpm/bdpm-resume.json \
                --latest=false --title "Médicaments (BDPM) $(date -u +%Y-%m)" --notes "$notes"
            fi
          fi
          bash .github/scripts/remplacer-piece.sh "$STABLE" "$archive" bdpm.zip

      # Les fiches data.gouv.fr pointent vers les adresses fixes : le fichier y est toujours
      # le dernier. Cette étape met à jour leur date et leur description, si la clé est fournie.
      - name: Fiches data.gouv.fr
        if: success()
        run: |
          if [ -z "$DATAGOUV_API_KEY" ]; then
            echo "Secret DATAGOUV_API_KEY absent : fiches data.gouv.fr non mises à jour."
            exit 0
          fi
          maj() {
            corps=$(node -e "const [t, d, u] = process.argv.slice(1); console.log(JSON.stringify({ title: t, description: d, url: u, filetype: 'remote', format: 'zip' }))" "$3" "$4" "$5")
            curl -fsS -X PUT "https://www.data.gouv.fr/api/1/datasets/$1/resources/$2/" \
              -H "X-API-KEY: $DATAGOUV_API_KEY" -H "Content-Type: application/json" --data "$corps" > /dev/null \
              && echo "fiche $1 : ressource mise à jour"
          }
          aujourdhui=$(date -u +%Y-%m-%d)
          if [ -f sortie/finess/structures-resume.json ]; then
            instantane=$(node -p "require('path').basename(require('./sortie/finess/structures-resume.json').source)")
            produit=$(node -p "String(require('./sortie/finess/structures-resume.json').generatedAt).slice(0, 10)")
            maj 6acdf823c5ac91c314f3fcd9 ef8f45ac-7ae6-4dbe-a196-8a067dfcdc33 \
              "FINESS en CSV, archive du mois (zip, toujours la dernière version)" \
              "Instantané mensuel ${instantane}, produit par l'ANS le ${produit}, converti le ${aujourdhui}. Même adresse chaque mois : le fichier est remplacé le 2." \
              "https://irreductix.fr/telecharger/finess.zip"
          fi
          if [ -f sortie/bdpm/bdpm-resume.json ]; then
            base=$(node -p "require('./sortie/bdpm/bdpm-resume.json').miseAJour || 'inconnue'")
            maj 6ace165d35e307cfd16ce39e 226cd996-6a5f-45a0-abcd-eae6c85427c2 \
              "Base des médicaments en CSV, archive du mois (zip, toujours la dernière version)" \
              "Base mise à jour le ${base} d'après sa page de téléchargement, convertie le ${aujourdhui}. Même adresse chaque mois : le fichier est remplacé le 2." \
              "https://irreductix.fr/telecharger/bdpm.zip"
          fi

      - name: Signal de vie
        if: success()
        run: |
          if [ -z "$HEALTHCHECKS_URL" ]; then
            echo "Secret HEALTHCHECKS_URL absent : pas de signal de vie."
            exit 0
          fi
          curl -fsS -m 10 --retry 3 "$HEALTHCHECKS_URL" > /dev/null && echo "signal de vie envoyé"

      - name: Ticket en cas d'échec
        if: failure()
        run: |
          titre="Publication mensuelle : échec du $(date -u +%Y-%m-%d)"
          corps="La publication des fichiers convertis a échoué : ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Les passages des 3 et 4 du mois réessaient. Si une adresse fixe ou un fichier du mois manque, relancer le workflow à la main avec « refaire » coché une fois la cause corrigée."
          gh label create publication --description "Publication mensuelle des fichiers convertis" --color D93F0B --force
          existant=$(gh issue list --label publication --state open --json number --jq '.[0].number')
          if [ -n "$existant" ]; then gh issue comment "$existant" --body "$corps"; else gh issue create --title "$titre" --body "$corps" --label publication; fi

      # Seulement quand les deux référentiels ont tourné : un lancement limité à
      # l'un ne referme pas le ticket ouvert pour l'autre.
      - name: Ticket refermé quand la publication repasse
        if: ${{ success() && (github.event_name == 'schedule' || inputs.cibles == 'tous') }}
        run: |
          for numero in $(gh issue list --label publication --state open --json number --jq '.[].number'); do
            gh issue close "$numero" --comment "La publication du $(date -u +%Y-%m-%d) a réussi."
          done
