name: Site vitrine

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # La page de contrôle lit l'index du mois sur la même origine que le site : on le
      # prend dans la release à adresse fixe, sans jamais le commiter.
      - name: Index FINESS du mois
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in index-finess.csv.gz index-finess.json index-medicaments.csv.gz index-medicaments.json; do
            gh release download donnees-du-mois --pattern "$f" --dir site --clobber || echo "$f absent de la release : la page de contrôle proposera le chargement depuis un fichier"
          done
          ls -la site/index-finess.* 2>/dev/null || true
      # La page Nomenclatures ne lit que des fichiers locaux : son archive hors ligne est la page elle-même.
      - name: Archive hors ligne de la page Nomenclatures
        run: (cd site/nomenclatures && zip -q -9 nomenclatures-hors-ligne.zip index.html nomenclatures.js logo.png irreductix.webp && ls -la nomenclatures-hors-ligne.zip)
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploiement
        uses: actions/deploy-pages@v5
